name: Sultan
permissions:
  contents: write # Allow writing to repository contents (for pushing tags)
  actions: write # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      codename:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["stock", "ksun-susfs"]
    steps:
      #- name: Maximize Build Space
      #  uses: AdityaGarg8/remove-unwanted-software@v5
      #  with:
      #    remove-dotnet: 'true'          # Frees ~2 GB
      #    remove-android: 'true'         # Frees ~9 GB
      #    remove-haskell: 'true'         # Frees ~5.2 GB
      #    remove-codeql: 'true'          # Frees ~5.4 GB
      #    remove-docker-images: 'true'   # Frees ~3.2 GB
      #    remove-large-packages: 'true'  # Frees ~3.1 GB
      #    remove-swapfile: 'true'        # Frees ~4 GB
      #    remove-cached-tools: 'false'   # Avoid unless confirmed safe
      #    verbose: 'true'                # Enable detailed logging

      - name: Download and extract GCC 14.2.0 toolchain
        run: |
          echo "Downloading GCC 14.2.0 cross-compiler toolchain..."
          wget https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "Extracting .gz file..."
          gunzip x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "Extracting .tar file..."
          tar -xf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar
          echo "GCC 14.2.0 toolchain extracted successfully"

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_tensynos"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

          echo "CONFIG set to: $CONFIG"

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."

          ANYKERNEL_BRANCH="sultan-${{ inputs.codename }}"

          # Debug print the branches
          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"

          # Clone repositories using the branch names
          git clone https://github.com/TheWildJames/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://github.com/TheWildJames/kernel_patches.git
          git clone https://github.com/kerneltoast/android_kernel_google_tensynos.git --branch 16.0.0-sultan --depth=1
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"

      - name: Add KernelSU
        if: contains(matrix.features, 'ksun')
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Adding KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

      - name: Apply SUSFS Patches
        if: contains(matrix.features, 'susfs')
        shell: bash
        run: |
          set -euo pipefail
          # Apply the exact upstream pershoot SUSFS coexistence commits.
          # The former patch files are absent from current WildKernels/kernel_patches.
          # Abort on any conflict; do not silently ignore this step.
          cd susfs4ksu
          git fetch https://gitlab.com/pershoot/susfs4ksu.git \
            6387756d64b3ab9ececefc4523627a9ee05a7519 \
            161c058fed5544a6573d87124f346dadd5c4962d
          git -c user.name=GitHubActions -c user.email=actions@github.com cherry-pick 6387756d64b3ab9ececefc4523627a9ee05a7519
          git -c user.name=GitHubActions -c user.email=actions@github.com cherry-pick 161c058fed5544a6573d87124f346dadd5c4962d
          cd ..

          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          SUSFS_VERSION="2.0.0"

          echo "Applying SUSFS patches..."

          # Copy SUSFS patches
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          perl -0pi -e 's/if \(IS_ERR\(f\) && !libperfmgr_redirect\(&f, dfd, tmp, &op, how\)\) \{/if (IS_ERR(f)) {/g' fs/open.c

          # Apply SUSFS patch, then check known Sultan context conflicts explicitly.
          patch_rc=0
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || patch_rc=$?
          if (( patch_rc > 1 )); then
            echo "SUSFS patch failed with fatal status $patch_rc" >&2
            exit "$patch_rc"
          fi

          perl -0pi -e 's/if \(IS_ERR\(f\)\) \{/if (IS_ERR(f) && !libperfmgr_redirect(&f, dfd, tmp, &op, how)) {/g' fs/open.c

          # Sultan newuname differs from GKI: preserve the existing target-specific fix.
          patch -p1 < ../kernel_patches/sultan/sys.c_fix.patch

          # Check exact reject hunks, apply only the verified missing declarations,
          # and fail on unexpected patch rejects.
          SUSFS_PATCH_RC="$patch_rc" python3 - <<'PY'
          import os
          from pathlib import Path

          rejected = {str(p) for p in Path(".").rglob("*.rej")}
          expected = {"fs/namespace.c.rej", "kernel/sys.c.rej"}
          unexpected = rejected - expected
          if unexpected:
              raise SystemExit(f"Unexpected SUSFS patch rejection(s): {sorted(unexpected)}")
          if int(os.environ["SUSFS_PATCH_RC"]) and not rejected:
              raise SystemExit("SUSFS patch returned failure without recognized rejects")

          ns = Path("fs/namespace.c")
          if "fs/namespace.c.rej" in rejected:
              rej = Path("fs/namespace.c.rej").read_text()
              if "#include <linux/susfs_def.h>" not in rej or "CL_COPY_MNT_NS BIT(25)" not in rej:
                  raise SystemExit("Unknown namespace.c reject content; refusing automatic fix")
              src = ns.read_text()
              anchor1 = "#include <linux/mnt_idmapping.h>\n"
              anchor2 = '#include "internal.h"\n'
              if src.count(anchor1) != 1 or src.count(anchor2) != 1:
                  raise SystemExit("namespace.c anchor changed; refusing automatic fix")
              if "#include <linux/susfs_def.h>" in src or "#define CL_COPY_MNT_NS BIT(25)" in src:
                  raise SystemExit("namespace.c already partially patched; manual review required")
              src = src.replace(anchor1, anchor1 + (
                  "#ifdef CONFIG_KSU_SUSFS\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif\n"
              ), 1)
              src = src.replace(anchor2, anchor2 + (
                  "\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n"
                  "extern bool susfs_is_current_ksu_domain(void);\n"
                  "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n"
                  "#define CL_COPY_MNT_NS BIT(25)\n"
                  "#endif\n"
              ), 1)
              ns.write_text(src)

          if "kernel/sys.c.rej" in rejected:
              rej = Path("kernel/sys.c.rej").read_text()
              src = Path("kernel/sys.c").read_text()
              if "susfs_spoof_uname(&tmp)" not in rej:
                  raise SystemExit("Unknown sys.c reject content")
              if src.count("susfs_spoof_uname(&tmp)") != 1 or src.count("susfs_is_uname_spoof_buffer_set;") != 1:
                  raise SystemExit("Sultan sys.c uname fix missing or duplicated")

          for p in rejected:
              Path(p).unlink()
          print("SUSFS patches verified; known Sultan namespace/newuname hunk conflicts reconciled")
          PY

      - name: Integrate pinned NoMount for zuma KernelSU/SUSFS
        if: matrix.features == 'ksun-susfs' && inputs.codename == 'zuma'
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          NOMOUNT_COMMIT="6298d58af34a82cb094ec62f14646f63e6b12797"
          curl -fsSL "https://raw.githubusercontent.com/maxsteeel/nomount/$NOMOUNT_COMMIT/kernel/setup.sh" -o /tmp/nomount-setup.sh
          sh /tmp/nomount-setup.sh "$NOMOUNT_COMMIT"
          test -L fs/nomount
          grep -Fq 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile
          grep -Fq 'source "fs/nomount/Kconfig"' fs/Kconfig

      - name: Configure KernelSU
        if: contains(matrix.features, 'ksun')
        run: |
          cd "$CONFIG"
          # KernelSU Configuration
          echo "# KernelSU Configuration" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          if [[ "${{ matrix.features }}" == *"susfs"* ]]; then
            echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          else
            echo "CONFIG_KSU_MANUAL_HOOKS=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
            echo "CONFIG_KSU_SUSFS=n" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
            patch -p1 < ../kernel_patches/wild/hooks/69_pure_manual_hooks_only.patch
          fi

      - name: Enable built-in NoMount for zuma
        if: matrix.features == 'ksun-susfs' && inputs.codename == 'zuma'
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          echo "CONFIG_NOMOUNT=y" >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig"

      - name: Configure Mountify Support
        if: matrix.features == 'ksun-susfs'
        run: |
          cd "$CONFIG"
          # Mountify Support
          echo "# Mountify Support" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig

      - name: Configure Networking
        run: |
          cd "$CONFIG"
          # Networking Configuration
          echo "# Networking Configuration" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig

      - name: Add IP SET & IPv6_NAT Support
        shell: bash
        run: |
          cd "$CONFIG"
          cat >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig" << 'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF

      - name: Apply TCP Congestion Control
        shell: bash
        run: |
          cd "$CONFIG"
          cat >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          EOF

      - name: Run sed and perl Commands
        if: matrix.features == 'ksun-susfs'
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Running sed commands..."
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-Sultan-Wild"/' ./arch/arm64/configs/${{ inputs.codename }}_defconfig

          sed -i '/echo "+"$/d' scripts/setlocalversion


      - name: Build the Kernel
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          make CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux- CC=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc -j$(nproc --all) ${{ inputs.codename }}_defconfig
          if [[ "${{ inputs.codename }}" == "zuma" && "${{ matrix.features }}" == "ksun-susfs" ]]; then
            CFG=".config"
            [[ -f "$CFG" ]] || CFG="out/.config"
            [[ -f "$CFG" ]] || { echo "Kernel .config was not generated" >&2; exit 1; }
            grep -Fxq "CONFIG_NOMOUNT=y" "$CFG" || { echo "CONFIG_NOMOUNT=y missing from $CFG" >&2; exit 1; }
            # KernelSU-Next Kbuild checks $(objtree)/usr/include/linux/unistd.h.
            # Without headers_install it disables preinit, even when CONFIG_KSU_SUSFS=y,
            # causing undefined references to ksu_setup_preinit_file and
            # ksu_preinit_handle_post_execveat during the final vmlinux link.
            make CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux- CC=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc INSTALL_HDR_PATH="$PWD/out/usr" headers_install
            test -s out/usr/include/linux/unistd.h || { echo "Kernel UAPI headers missing after headers_install" >&2; exit 1; }
          fi
          make CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux- CC=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc LOCALVERSION_AUTO=0 -j$(nproc --all)
          if [[ "${{ inputs.codename }}" == "zuma" && "${{ matrix.features }}" == "ksun-susfs" ]]; then
            test -s out/drivers/kernelsu/preinit/preinit.o || { echo "KernelSU preinit was not compiled" >&2; exit 1; }
          fi

      - name: Copy Images
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Copying Image.lz4 and concatenating DTB files..."
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          #if [ "${{ inputs.codename }}" == "gs201" ]; then
          #  cat ./out/google-devices/gs201/dts/*.dtb > ../AnyKernel3/dtb
          #  #cp ./out/google-devices/gs201/dts/dtbo.img ../AnyKernel3/dtbo.img
          #elif [ "${{ inputs.codename }}" == "zuma" ]; then
          #  cat ./out/google-devices/zuma/dts/*.dtb > ../AnyKernel3/dtb
          #elif [ "${{ inputs.codename }}" == "zumapro" ]; then
          #  cat ./out/google-devices/zumapro/dts/*.dtb > ../AnyKernel3/dtb
          #fi

      - name: Create ZIP Files for Different Formats
        run: |
          echo "Navigating to AnyKernel3 directory..."
          cd ./AnyKernel3

          # Zip the files in the AnyKernel3 directory with a new naming convention
          ZIP_NAME="${{ inputs.codename }}-a16-${{ matrix.features }}-anykernel3.zip"
          if [[ "${{ inputs.codename }}" == "zuma" && "${{ matrix.features }}" == "ksun-susfs" ]]; then
            ZIP_NAME="zuma-a16-ksun-susfs-nomount-anykernel3.zip"
          fi
          echo "Creating zip file $ZIP_NAME..."
          zip -r "../$ZIP_NAME" ./*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-${{ matrix.features }}
          path: |
            *.zip

      - name: Collect .rej files
        if: ${{ always() }}
        id: collect_rej
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf rej
          mkdir -p rej

          found="false"
          while IFS= read -r -d '' rej_file; do
            found="true"
            original_file="${rej_file%.rej}"
            rej_rel="${rej_file#./}"
            original_rel="${original_file#./}"

            mkdir -p "rej/$(dirname "$rej_rel")"
            cp -f "$rej_file" "rej/$rej_rel"

            if [[ -f "$original_file" ]]; then
              mkdir -p "rej/$(dirname "$original_rel")"
              cp -f "$original_file" "rej/$original_rel"
            fi
          done < <(find . -type f -name '*.rej' -print0)

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Zip collected .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -r "rej-${{ inputs.codename }}-${{ matrix.features }}.zip" rej

      - name: Upload .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rej-${{ inputs.codename }}-${{ matrix.features }}
          path: |
            rej-${{ inputs.codename }}-${{ matrix.features }}.zip
