name: Build PiP10 APK
on:
  push:
    branches: [pip10-build]
    paths:
      - 'pip10/**'
      - '.github/workflows/pip10-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pip10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" || true
      - name: Install SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PiP10-LSPosed-APK
          path: pip10/app/build/outputs/apk/debug/app-debug.apk
