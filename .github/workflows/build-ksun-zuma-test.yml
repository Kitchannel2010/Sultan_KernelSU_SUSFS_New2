name: Experimental Sultan zuma updated KSU Next

on:
  workflow_dispatch:
  push:
    branches: [ksun-upgrade]
    paths: [.github/workflows/build-ksun-zuma-test.yml]

permissions:
  contents: read

jobs:
  build-kernel-sultan-kernelsu-susfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build tooling
        uses: actions/checkout@v4

      #- name: Maximize Build Space
      #  uses: AdityaGarg8/remove-unwanted-software@v5
      #  with:
      #    remove-dotnet: 'true'          # Frees ~2 GB
      #    remove-android: 'true'         # Frees ~9 GB
      #    remove-haskell: 'true'         # Frees ~5.2 GB
      #    remove-codeql: 'true'          # Frees ~5.4 GB
      #    remove-docker-images: 'true'   # Frees ~3.2 GB
      #    remove-large-packages: 'true'  # Frees ~3.1 GB
      #    remove-swapfile: 'true'        # Frees ~4 GB
      #    remove-cached-tools: 'false'   # Avoid unless confirmed safe
      #    verbose: 'true'                # Enable detailed logging

      - name: Download and extract GCC 14.2.0 toolchain
        run: |
          echo "Downloading GCC 14.2.0 cross-compiler toolchain..."
          wget https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "Extracting .gz file..."
          gunzip x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "Extracting .tar file..."
          tar -xf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar
          echo "GCC 14.2.0 toolchain extracted successfully"

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_zuma"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

          echo "CONFIG set to: $CONFIG"

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."

          ANYKERNEL_BRANCH="sultan-zuma"
          SUSFS_BRANCH="gki-android14-6.1"

          # Debug print the branches
          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"
          echo "Using branch for SUSFS: $SUSFS_BRANCH"

          # Clone repositories using the branch names
          git clone https://github.com/WildKernels/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git -C AnyKernel3 fetch --depth=1 origin e36787fb5ad049ae69fe0c99c488f387618f2ac8
          git -C AnyKernel3 checkout --detach e36787fb5ad049ae69fe0c99c488f387618f2ac8
          git clone https://github.com/WildKernels/kernel_patches.git
          git -C kernel_patches checkout --detach a7b2ea40283a6810d7479a58230fd2c3994ebfd5
          #git clone https://github.com/kerneltoast/android_kernel_google_zuma
          git clone --depth 1 --single-branch https://github.com/kerneltoast/android_kernel_google_zuma
          git -C android_kernel_google_zuma fetch --depth=1 origin 8ef1cd1f141052a6bc0c1a93fb9cf5d013e227d2
          git -C android_kernel_google_zuma checkout --detach 8ef1cd1f141052a6bc0c1a93fb9cf5d013e227d2
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          SUSFS_SHA="46fb6bb2adc5dde72673009e0cd7e57e3afe2036"
          test -n "$SUSFS_SHA"
          git -C susfs4ksu checkout --detach "$SUSFS_SHA"
          echo "SUSFS_SHA=$SUSFS_SHA" >> "$GITHUB_ENV"
          echo "Historical SUSFS SHA: $SUSFS_SHA"
          git -C susfs4ksu show -s --format='%h %cI %s' HEAD

      - name: Add KernelSU
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Adding KernelSU..."
          set -euo pipefail
          git clone https://github.com/pershoot/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next fetch origin 956ea0f526fd4e216f8d67844cb61b34a4c49bfe
          git -C KernelSU-Next checkout --detach 956ea0f526fd4e216f8d67844cb61b34a4c49bfe
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "956ea0f526fd4e216f8d67844cb61b34a4c49bfe"
          ln -s "$(realpath --relative-to=drivers KernelSU-Next/kernel)" drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -f drivers/kernelsu/Kconfig

      - name: Adapt newer KSU sucompat optimization to SUSFS v2.0.0
        run: |
          set -euo pipefail
          file="$CONFIG/KernelSU-Next/kernel/feature/sucompat.c"
          # SUSFS 2.0.0 does not provide the optional per-process no_su flag.
          # Keep the early return for unrelated init execve children, but do not
          # attempt to set the flag that was introduced in later SUSFS versions.
          grep -Fq 'susfs_is_current_proc_no_su()' "$file"
          grep -Fq 'susfs_set_current_proc_no_su()' "$file"
          sed -i 's/if (likely(!ksu_is_zygote_or_adbd(filename->name, len)) \&\&/if (likely(!ksu_is_zygote_or_adbd(filename->name, len)))/' "$file"
          sed -i '/!susfs_is_current_proc_no_su()/d' "$file"
          sed -i '/susfs_set_current_proc_no_su();/d' "$file"
          sed -i '/pr_info("susfs: mark no sucompat checks for pid:/d' "$file"
          if grep -Eq 'susfs_(is|set)_current_proc_no_su' "$file"; then exit 1; fi
          sed -n '185,210p' "$file"

          # SUSFS 2.0.0 can mark processes as umounted, but lacks newer
          # zygote_next-specific and no_su flags. Keep the existing normal
          # SUSFS umounted flag and mount-work scheduling intact.
          hook="$CONFIG/KernelSU-Next/kernel/hook/setuid_hook.c"
          grep -Fq 'susfs_set_current_proc_no_su();' "$hook"
          grep -Fq 'susfs_set_current_proc_umounted_for_zygote_next();' "$hook"
          sed -i '/susfs_set_current_proc_no_su();/d' "$hook"
          sed -i '/susfs_set_current_proc_umounted_for_zygote_next();/d' "$hook"
          if grep -Eq 'susfs_set_current_proc_(no_su|umounted_for_zygote_next)' "$hook"; then exit 1; fi
          grep -n 'susfs_set_current_proc_umounted();' "$hook"

          # Preserve the old SUSFS 2.0.0 userspace command and kernel API.
          # Do NOT alias the newer non-su-only command to the all-process variant.
          dispatch="$CONFIG/KernelSU-Next/kernel/supercall/dispatch.c"
          python3 - "$dispatch" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          src = p.read_text()
          changes = [
              (
                  '            susfs_start_sdcard_monitor_fn();',
                  ''
              ),
              (
                  '        if (susfs_is_current_proc_no_su()) {\n'
                  '            ret = 0; // SYSCALL_TRACEPOINT is NOT flagged\n'
                  '        } else {\n'
                  '            ret = 1; // SYSCALL_TRACEPOINT is flagged\n'
                  '        }',
                  '        ret = 1; // SUSFS v2.0.0 does not provide per-process no_su flags'
              ),
              (
                  '        case CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS:\n'
                  '            susfs_set_hide_sus_mnts_for_non_su_procs(arg);',
                  '        case CMD_SUSFS_HIDE_SUS_MNTS_FOR_ALL_PROCS:\n'
                  '            susfs_set_hide_sus_mnts_for_all_procs(arg);'
              ),
          ]
          for old, new in changes:
              if src.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for: {old!r}; found {src.count(old)}')
              src = src.replace(old, new)
          p.write_text(src)
          PY

      - name: Adapt KSU adb_root path helpers to old SUSFS v2.0.0
        run: |
          set -euo pipefail
          file="$CONFIG/KernelSU-Next/kernel/feature/adb_root.c"
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          src = p.read_text()
          pairs = [
              ('susfs_starts_with(filename, "/apex/")',
               'strncmp(filename, "/apex/", sizeof("/apex/") - 1) == 0'),
              ('susfs_ends_with(filename, "/adbd")',
               '(strlen(filename) >= sizeof("/adbd") - 1 && '
               'strcmp(filename + strlen(filename) - (sizeof("/adbd") - 1), "/adbd") == 0)'),
          ]
          for old, new in pairs:
              if src.count(old) != 1:
                  raise SystemExit(f"Expected one adb_root call {old!r}, found {src.count(old)}")
              src = src.replace(old, new)
          p.write_text(src)
          PY
          ! grep -Eq 'susfs_(starts|ends)_with' "$file"

      - name: Apply SUSFS Patches
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Applying SUSFS patches..."

          # Copy SUSFS patches
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          # Change to common directory and apply SUSFS patch
          # Old Sultan modifies newuname. The historical SUSFS patch's
          # sole kernel/sys.c newuname hunk is replaced by sys.c_fix.patch.
          if ! patch --batch -p1 < 50_add_susfs_in_gki-android14-6.1.patch; then
            test -f kernel/sys.c.rej
            test "$(find . -name '*.rej' | wc -l)" -eq 1
            grep -q 'susfs_spoof_uname' kernel/sys.c.rej
            echo 'Using the Sultan-specific newuname fix for the known reject'
          fi
          cp ../kernel_patches/sultan/sys.c_fix.patch ./
          patch --batch -p1 < sys.c_fix.patch
          grep -q 'susfs_spoof_uname(&tmp)' kernel/sys.c
          rm -f kernel/sys.c.rej
          if find . -name '*.rej' | grep -q .; then echo 'ERROR: patch rejects found'; find . -name '*.rej'; exit 1; fi
          grep -n 'SUSFS_VERSION' include/linux/susfs.h || true

      - name: Bridge SUSFS 2.0.0 and updated KSU hook APIs
        run: |
          set -euo pipefail
          python3 - "$CONFIG" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          k = root / 'KernelSU-Next/kernel'
          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == count, (str(p), old, s.count(old), count)
              p.write_text(s.replace(old, new))

          # patch_memory is required by selinux_hide even when KPROBES is off.
          replace(k/'Kbuild', '''kernelsu-objs += hook/lsm_hook.o
          ifdef KSU_ARCH
          kernelsu-objs += hook/$(KSU_ARCH)/patch_memory.o
          endif
          endif''', '''kernelsu-objs += hook/lsm_hook.o
          endif
          ifdef KSU_ARCH
          kernelsu-objs += hook/$(KSU_ARCH)/patch_memory.o
          endif''')

          # SUSFS 2.0 resolves paths synchronously; it has no later extra-work queue.
          replace(k/'hook/setuid_hook.c', '''extern struct work_struct susfs_extra_works;

          static inline void ksu_handle_extra_susfs_work(void)
          {
              if (work_pending(&susfs_extra_works))
                  return;

              schedule_work(&susfs_extra_works);
          }
          ''', '')
          replace(k/'hook/setuid_hook.c', '''        // Handle extra susfs work
                  ksu_handle_extra_susfs_work();''', '        // SUSFS 2.0.0 has no asynchronous extra-work queue.', 2)
          replace(k/'supercall/dispatch.c', 'extern struct work_struct susfs_extra_works;\n', '')
          replace(k/'supercall/dispatch.c', '''#ifdef CONFIG_KSU_SUSFS
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
                      if (!work_pending(&susfs_extra_works)) {
                          schedule_work(&susfs_extra_works);
                      }
          #endif

          #endif
          ''', '')
          replace(k/'supercall/dispatch.c', '''#if defined(CONFIG_KSU_SUSFS) && defined(CONFIG_KSU_SUSFS_SUS_PATH)
                  if (!work_pending(&susfs_extra_works)) {
                      schedule_work(&susfs_extra_works);
                  }
          #endif
          ''', '')

          # Query the actual old uname API instead of inventing a static key/state.
          replace(k/'supercall/supercall.c', 'extern struct static_key_false susfs_is_uname_spoof_buffer_set;', '''#include <linux/susfs.h>
          static bool ksu_susfs_uname_active(void)
          {
              struct new_utsname probe = {0};
              susfs_spoof_uname(&probe);
              return probe.release[0] != '\\0';
          }''')
          replace(k/'supercall/supercall.c', 'static_branch_unlikely(&susfs_is_uname_spoof_buffer_set)', 'ksu_susfs_uname_active()')

          # SUSFS v2.0.0 requires Zygote/zygote_next SIDs for setresuid()
          # to install the Manager driver FD and disable app seccomp.
          # This KSUN source defines susfs_set_batch_sid() but never invokes it;
          # normal cache_sid() only populates the separate cached_*_sid fields.
          # Call it after the policy has loaded, at the existing cache_sid() sites.
          replace(k/'selinux/selinux.c', '''    }
          }

          /*
           * Fast path: compare task's SID directly against cached value.''', '''    }
          #ifdef CONFIG_KSU_SUSFS
              // The SUSFS setresuid hook checks susfs_zygote_sid, not cached_zygote_sid.
              // Without this call those SIDs stay zero and Manager root cannot start.
              susfs_set_batch_sid();
          #endif
          }

          /*
           * Fast path: compare task's SID directly against cached value.''')
          assert (k/'selinux/selinux.c').read_text().count('    susfs_set_batch_sid();') == 1
          assert 'susfs_is_sid_equal(current_cred(), susfs_zygote_sid)' in (k/'hook/setuid_hook.c').read_text()

          # Restore the old devpts handler (with current allowlist checking).
          replace(k/'feature/sucompat.c', '#define SU_PATH', '''#ifdef CONFIG_KSU_SUSFS
          int ksu_handle_devpts(struct inode *inode)
          {
              struct inode_security_struct *sec;
              uid_t uid = current_uid().val;
              if (!current->mm || !inode || uid % 100000 < 10000)
                  return 0;
              if (!ksu_is_allow_uid_for_current(uid))
                  return 0;
              if (ksu_file_sid) {
                  sec = selinux_inode(inode);
                  if (sec)
                      sec->sid = ksu_file_sid;
              }
              return 0;
          }
          #endif

          #define SU_PATH''')

          # This Sultan's do_faccessat passes a userspace string, not struct filename.
          p = k/'feature/sucompat.c'
          s = p.read_text()
          start = s.index('#ifdef CONFIG_KSU_SUSFS\nint ksu_handle_faccessat(')
          end = s.index('\n#ifdef CONFIG_KSU_SUSFS\nint ksu_handle_stat(', start)
          s = s[:start] + '''int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
                                  int *mode, int *__unused_flags)
          {
              char path[sizeof(su_path)] = {0};
              long len;
              if (!filename_user || current_chrooted() ||
                  !ksu_is_allow_uid_for_current(current_uid().val))
                  return 0;
              len = strncpy_from_user_nofault(path, *filename_user, sizeof(path));
              if (len == sizeof(su_path) - 1 && !memcmp(path, su_path, sizeof(su_path))) {
                  ksu_compat_sulog('a');
                  *filename_user = sh_user_path();
              }
              return 0;
          }
          ''' + s[end:]
          p.write_text(s)
          replace(k/'feature/sucompat.h', 'int ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode, int *__unused_flags);', 'int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *__unused_flags);')

          # Adapt only integration call sites to the real KSU static keys/state.
          for name in ['fs/exec.c', 'fs/open.c', 'fs/stat.c']:
              p = root/name
              replace(p, 'extern bool ksu_su_compat_enabled __read_mostly;', '#include <linux/jump_label.h>\nextern struct static_key_true ksu_su_compat_enabled;')
              replace(p, '!ksu_su_compat_enabled)', '!static_branch_unlikely(&ksu_su_compat_enabled))')
          p = root/'fs/exec.c'
          replace(p, 'extern bool ksu_execveat_hook __read_mostly;', 'extern struct static_key_true is_first_zygote;')
          replace(p, 'extern bool susfs_is_boot_completed_triggered __read_mostly;', 'extern bool ksu_boot_completed;')
          replace(p, 'ksu_execveat_hook || !susfs_is_boot_completed_triggered', 'static_branch_unlikely(&is_first_zygote) || !ksu_boot_completed')
          p = root/'fs/namespace.c'
          s = p.read_text()
          assert 'susfs_is_boot_completed_triggered' in s
          p.write_text(s.replace('susfs_is_boot_completed_triggered', 'ksu_boot_completed'))
          p = root/'fs/read_write.c'
          replace(p, 'extern bool ksu_vfs_read_hook __read_mostly;', '#include <linux/jump_label.h>\nextern struct static_key_true ksu_is_init_rc_hook_enabled;')
          replace(p, 'unlikely(ksu_vfs_read_hook)', 'static_branch_unlikely(&ksu_is_init_rc_hook_enabled)')
          replace(p, 'extern __attribute__((cold)) int ksu_handle_sys_read', 'extern void ksu_handle_sys_read')
          p = root/'drivers/input/input.c'
          replace(p, 'extern bool ksu_input_hook __read_mostly;', '#include <linux/jump_label.h>\nextern struct static_key_true ksu_is_input_hook_enabled;')
          replace(p, 'unlikely(ksu_input_hook)', 'static_branch_unlikely(&ksu_is_input_hook_enabled)')
          # Restore the two external-directory commands that SUSFS 2.0 userspace needs.
          replace(k/'supercall/dispatch.c', '''        case CMD_SUSFS_ADD_SUS_PATH_LOOP:
                      susfs_add_sus_path_loop(arg);
                      return 0;''', '''        case CMD_SUSFS_ADD_SUS_PATH_LOOP:
                      susfs_add_sus_path_loop(arg);
                      return 0;
                  case CMD_SUSFS_SET_ANDROID_DATA_ROOT_PATH:
                  case CMD_SUSFS_SET_SDCARD_ROOT_PATH:
                      susfs_set_i_state_on_external_dir(arg);
                      return 0;''')
          replace(k/'supercall/dispatch.c', 'ret = 1; // SUSFS v2.0.0 does not provide per-process no_su flags', 'ret = susfs_is_current_proc_umounted() ? 0 : 1; // SUSFS 2.0 hook gate')
          print('Adapted KSU Next to SUSFS 2.0.0 hook ABI and lifecycle')
          PY

      - name: Instrument and validate KSU root authorization (read-only)
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/instrument_ksu_root.py" "$CONFIG"

      - name: Configure KernelSU
        run: |
          cd "$CONFIG"
          # KernelSU Configuration
          echo "# KernelSU Configuration" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/zuma_defconfig

      - name: Configure Mountify Support
        run: |
          cd "$CONFIG"
          # Mountify Support
          echo "# Mountify Support" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./arch/arm64/configs/zuma_defconfig

      - name: Configure Networking
        run: |
          cd "$CONFIG"
          # Networking Configuration
          echo "# Networking Configuration" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> ./arch/arm64/configs/zuma_defconfig

      - name: Configure TCP Congestion Control
        run: |
          cd "$CONFIG"
          # BBR TCP Congestion Control
          echo "# BBR TCP Congestion Control" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_BBR=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_NET_SCH_FQ=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_BIC=n" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_HTCP=n" >> ./arch/arm64/configs/zuma_defconfig

      - name: Configure IPSet Support
        run: |
          cd "$CONFIG"
          # IPSet support
          echo "# IPSet Support" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./arch/arm64/configs/zuma_defconfig

      - name: Run sed and perl Commands
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Running sed commands..."
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-Sultan-Wild"/' ./arch/arm64/configs/zuma_defconfig

      - name: Build the Kernel
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          make CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux- CC=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc -j$(nproc --all) zuma_defconfig
          grep '^CONFIG_KSU=y$' out/.config
          grep '^CONFIG_KSU_SUSFS=y$' out/.config
          make CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux- CC=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc -j$(nproc --all)

      - name: Copy Images
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Copying Image.lz4 and concatenating DTB files..."
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          if [ "zuma" == "gs201" ]; then
            cat ./out/google-devices/gs201/dts/*.dtb > ../AnyKernel3/dtb
            #cp ./out/google-devices/gs201/dts/dtbo.img ../AnyKernel3/dtbo.img
          elif [ "zuma" == "zuma" ]; then
            cat ./out/google-devices/zuma/dts/*.dtb > ../AnyKernel3/dtb
          elif [ "zuma" == "zumapro" ]; then
            cat ./out/google-devices/zumapro/dts/*.dtb > ../AnyKernel3/dtb
          fi

      - name: Create ZIP Files for Different Formats
        run: |
          echo "Navigating to AnyKernel3 directory..."
          cd ./AnyKernel3

          # Zip the files in the AnyKernel3 directory with a new naming convention
          ZIP_NAME="zuma_A16_Sultan_KSUN_updated_SUSFS_EXPERIMENTAL.zip"
          echo "Creating zip file $ZIP_NAME..."
          zip -r "../$ZIP_NAME" ./*

      - name: Verify AnyKernel3 payload against build outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct, zipfile
          root = Path('android_kernel_google_zuma')
          zip_path = Path('zuma_A16_Sultan_KSUN_updated_SUSFS_EXPERIMENTAL.zip')
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          image = (root/'out/arch/arm64/boot/Image').read_bytes()
          assert image[56:60] == b'ARM\x64', 'Not an ARM64 kernel image'
          compressed = (root/'out/arch/arm64/boot/Image.lz4').read_bytes()
          assert compressed[:4] in [bytes.fromhex('02214c18'), bytes.fromhex('04224d18')], 'Not LZ4'
          dtbs = sorted((root/'out/google-devices/zuma/dts').glob('*.dtb'))
          assert dtbs, 'No zuma DTBs'
          joined = b''.join(p.read_bytes() for p in dtbs)
          for p in dtbs:
              data = p.read_bytes()
              magic, size = struct.unpack_from('>II', data)
              assert magic == 0xd00dfeed and size == len(data), f'Invalid DTB: {p}'
              assert b'zuma' in data, f'Unexpected device tree: {p}'
          required = ['anykernel.sh','META-INF/com/google/android/update-binary',
                      'META-INF/com/google/android/updater-script','tools/ak3-core.sh',
                      'tools/magiskboot','tools/busybox']
          with zipfile.ZipFile(zip_path) as z:
              assert z.testzip() is None, 'ZIP CRC failure'
              assert len(z.namelist()) == len(set(z.namelist())), 'Duplicate ZIP entries'
              assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
              assert z.read('Image.lz4') == compressed, 'ZIP kernel differs from build'
              assert z.read('dtb') == joined, 'ZIP DTB differs from build'
              for name in required:
                  assert z.read(name) == (Path('AnyKernel3')/name).read_bytes(), name
              script = z.read('anykernel.sh').decode()
              for line in ['do.devicecheck=1','device.name1=husky','block=boot;',
                           'block=vendor_kernel_boot;','is_slot_device=1;']:
                  assert line in script, line
          config = (root/'out/.config').read_text()
          for flag in ['CONFIG_KSU=y','CONFIG_KSU_SUSFS=y']:
              assert flag in config.splitlines(), flag
          assert '#define SUSFS_VERSION "v2.0.0"' in (root/'include/linux/susfs.h').read_text()
          report = {'zip':str(zip_path),'sha256':sha(zip_path.read_bytes()),
                    'image_lz4_sha256':sha(compressed),'image_sha256':sha(image),
                    'dtb_sha256':sha(joined),'dtbs':[p.name for p in dtbs],
                    'installation_files':required,'boot_compatibility':'NOT TESTED'}
          Path('build-verification.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Write build source report
        if: success()
        run: |
          printf 'Sultan kernel: 8ef1cd1f141052a6bc0c1a93fb9cf5d013e227d2\nKSU Next: 956ea0f526fd4e216f8d67844cb61b34a4c49bfe\nKernel patches: a7b2ea40283a6810d7479a58230fd2c3994ebfd5\nSUSFS: %s\n' "$SUSFS_SHA" | tee build-source-versions.txt
          sha256sum zuma_A16_Sultan_KSUN_updated_SUSFS_EXPERIMENTAL.zip | tee build-sha256.txt
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zuma-ksun-experimental-anykernel3
          path: |
            *.zip
            build-source-versions.txt
            build-sha256.txt
            build-verification.json
            android_kernel_google_zuma/out/.config
          include-hidden-files: true
          retention-days: 30

      - name: Scan and collect patch rejects
        if: ${{ always() }}
        run: |
          set -e
          CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"
          # Find all .rej files under the configuration directory
          mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files under $CONFIG_DIR"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              # Relative path from $CONFIG
              REL="${REJ#"$CONFIG_DIR"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"
              # Copy the associated original file alongside the .rej
              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
                mkdir -p "$(dirname "$ORIG_DEST")"
                cp "$ORIG" "$ORIG_DEST"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: Upload Rejects
        if: ${{ always() && env.REJ_COUNT > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9
