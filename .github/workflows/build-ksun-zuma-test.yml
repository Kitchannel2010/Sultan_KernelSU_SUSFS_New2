name: Experimental Sultan zuma updated KSU Next

on:
  workflow_dispatch:
  push:
    branches: [ksun-upgrade]
    paths: [.github/workflows/build-ksun-zuma-test.yml]

permissions:
  contents: read

jobs:
  build-kernel-sultan-kernelsu-susfs:
    runs-on: ubuntu-latest
    steps:
      #- name: Maximize Build Space
      #  uses: AdityaGarg8/remove-unwanted-software@v5
      #  with:
      #    remove-dotnet: 'true'          # Frees ~2 GB
      #    remove-android: 'true'         # Frees ~9 GB
      #    remove-haskell: 'true'         # Frees ~5.2 GB
      #    remove-codeql: 'true'          # Frees ~5.4 GB
      #    remove-docker-images: 'true'   # Frees ~3.2 GB
      #    remove-large-packages: 'true'  # Frees ~3.1 GB
      #    remove-swapfile: 'true'        # Frees ~4 GB
      #    remove-cached-tools: 'false'   # Avoid unless confirmed safe
      #    verbose: 'true'                # Enable detailed logging

      - name: Download and extract GCC 14.2.0 toolchain
        run: |
          echo "Downloading GCC 14.2.0 cross-compiler toolchain..."
          wget https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "Extracting .gz file..."
          gunzip x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          echo "Extracting .tar file..."
          tar -xf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar
          echo "GCC 14.2.0 toolchain extracted successfully"

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_zuma"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

          echo "CONFIG set to: $CONFIG"

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."

          ANYKERNEL_BRANCH="sultan-zuma"
          SUSFS_BRANCH="gki-android14-6.1"

          # Debug print the branches
          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"
          echo "Using branch for SUSFS: $SUSFS_BRANCH"

          # Clone repositories using the branch names
          git clone https://github.com/WildKernels/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git -C AnyKernel3 fetch --depth=1 origin e36787fb5ad049ae69fe0c99c488f387618f2ac8
          git -C AnyKernel3 checkout --detach e36787fb5ad049ae69fe0c99c488f387618f2ac8
          git clone https://github.com/WildKernels/kernel_patches.git
          git -C kernel_patches checkout --detach a7b2ea40283a6810d7479a58230fd2c3994ebfd5
          #git clone https://github.com/kerneltoast/android_kernel_google_zuma
          git clone --depth 1 --single-branch https://github.com/kerneltoast/android_kernel_google_zuma
          git -C android_kernel_google_zuma fetch --depth=1 origin 8ef1cd1f141052a6bc0c1a93fb9cf5d013e227d2
          git -C android_kernel_google_zuma checkout --detach 8ef1cd1f141052a6bc0c1a93fb9cf5d013e227d2
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          SUSFS_SHA="$(git -C susfs4ksu rev-list -1 --before='2026-01-08T18:18:16Z' HEAD)"
          test -n "$SUSFS_SHA"
          git -C susfs4ksu checkout --detach "$SUSFS_SHA"
          echo "SUSFS_SHA=$SUSFS_SHA" >> "$GITHUB_ENV"
          echo "Historical SUSFS SHA: $SUSFS_SHA"
          git -C susfs4ksu show -s --format='%h %cI %s' HEAD

      - name: Add KernelSU
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Adding KernelSU..."
          set -euo pipefail
          git clone https://github.com/pershoot/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next checkout --detach 956ea0f526fd4e216f8d67844cb61b34a4c49bfe
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "956ea0f526fd4e216f8d67844cb61b34a4c49bfe"
          ln -s "$(realpath --relative-to=drivers KernelSU-Next/kernel)" drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -f drivers/kernelsu/Kconfig

      - name: Adapt newer KSU sucompat optimization to SUSFS v2.0.0
        run: |
          set -euo pipefail
          file="$CONFIG/KernelSU-Next/kernel/feature/sucompat.c"
          # SUSFS 2.0.0 does not provide the optional per-process no_su flag.
          # Keep the early return for unrelated init execve children, but do not
          # attempt to set the flag that was introduced in later SUSFS versions.
          grep -Fq 'susfs_is_current_proc_no_su()' "$file"
          grep -Fq 'susfs_set_current_proc_no_su()' "$file"
          sed -i 's/if (likely(!ksu_is_zygote_or_adbd(filename->name, len)) \&\&/if (likely(!ksu_is_zygote_or_adbd(filename->name, len)))/' "$file"
          sed -i '/!susfs_is_current_proc_no_su()/d' "$file"
          sed -i '/susfs_set_current_proc_no_su();/d' "$file"
          sed -i '/pr_info("susfs: mark no sucompat checks for pid:/d' "$file"
          if grep -Eq 'susfs_(is|set)_current_proc_no_su' "$file"; then exit 1; fi
          sed -n '185,210p' "$file"

      - name: Apply SUSFS Patches
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Applying SUSFS patches..."

          # Copy SUSFS patches
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          # Change to common directory and apply SUSFS patch
          # Old Sultan modifies newuname. The historical SUSFS patch's
          # sole kernel/sys.c newuname hunk is replaced by sys.c_fix.patch.
          if ! patch --batch -p1 < 50_add_susfs_in_gki-android14-6.1.patch; then
            test -f kernel/sys.c.rej
            test "$(find . -name '*.rej' | wc -l)" -eq 1
            grep -q 'susfs_spoof_uname' kernel/sys.c.rej
            echo 'Using the Sultan-specific newuname fix for the known reject'
          fi
          cp ../kernel_patches/sultan/sys.c_fix.patch ./
          patch --batch -p1 < sys.c_fix.patch
          grep -q 'susfs_spoof_uname(&tmp)' kernel/sys.c
          rm -f kernel/sys.c.rej
          if find . -name '*.rej' | grep -q .; then echo 'ERROR: patch rejects found'; find . -name '*.rej'; exit 1; fi
          grep -n 'SUSFS_VERSION' include/linux/susfs.h || true

      - name: Configure KernelSU
        run: |
          cd "$CONFIG"
          # KernelSU Configuration
          echo "# KernelSU Configuration" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/zuma_defconfig

      - name: Configure Mountify Support
        run: |
          cd "$CONFIG"
          # Mountify Support
          echo "# Mountify Support" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./arch/arm64/configs/zuma_defconfig

      - name: Configure Networking
        run: |
          cd "$CONFIG"
          # Networking Configuration
          echo "# Networking Configuration" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> ./arch/arm64/configs/zuma_defconfig

      - name: Configure TCP Congestion Control
        run: |
          cd "$CONFIG"
          # BBR TCP Congestion Control
          echo "# BBR TCP Congestion Control" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_BBR=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_NET_SCH_FQ=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_BIC=n" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_TCP_CONG_HTCP=n" >> ./arch/arm64/configs/zuma_defconfig

      - name: Configure IPSet Support
        run: |
          cd "$CONFIG"
          # IPSet support
          echo "# IPSet Support" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_MAX=65534" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_MAC=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> ./arch/arm64/configs/zuma_defconfig
          echo "CONFIG_IP_SET_LIST_SET=y" >> ./arch/arm64/configs/zuma_defconfig

      - name: Run sed and perl Commands
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Running sed commands..."
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-Sultan-Wild"/' ./arch/arm64/configs/zuma_defconfig

      - name: Build the Kernel
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          make CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux- CC=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc -j$(nproc --all) zuma_defconfig
          grep '^CONFIG_KSU=y$' out/.config
          grep '^CONFIG_KSU_SUSFS=y$' out/.config
          make CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux- CC=$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc -j$(nproc --all)

      - name: Copy Images
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Copying Image.lz4 and concatenating DTB files..."
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          if [ "zuma" == "gs201" ]; then
            cat ./out/google-devices/gs201/dts/*.dtb > ../AnyKernel3/dtb
            #cp ./out/google-devices/gs201/dts/dtbo.img ../AnyKernel3/dtbo.img
          elif [ "zuma" == "zuma" ]; then
            cat ./out/google-devices/zuma/dts/*.dtb > ../AnyKernel3/dtb
          elif [ "zuma" == "zumapro" ]; then
            cat ./out/google-devices/zumapro/dts/*.dtb > ../AnyKernel3/dtb
          fi

      - name: Create ZIP Files for Different Formats
        run: |
          echo "Navigating to AnyKernel3 directory..."
          cd ./AnyKernel3

          # Zip the files in the AnyKernel3 directory with a new naming convention
          ZIP_NAME="zuma_A16_Sultan_KSUN_updated_SUSFS_EXPERIMENTAL.zip"
          echo "Creating zip file $ZIP_NAME..."
          zip -r "../$ZIP_NAME" ./*

      - name: Write build source report
        if: success()
        run: |
          printf 'Sultan kernel: 8ef1cd1f141052a6bc0c1a93fb9cf5d013e227d2\nKSU Next: 956ea0f526fd4e216f8d67844cb61b34a4c49bfe\nKernel patches: a7b2ea40283a6810d7479a58230fd2c3994ebfd5\nSUSFS: %s\n' "$SUSFS_SHA" | tee build-source-versions.txt
          sha256sum zuma_A16_Sultan_KSUN_updated_SUSFS_EXPERIMENTAL.zip | tee build-sha256.txt
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zuma-ksun-experimental-anykernel3
          path: |
            *.zip
            build-source-versions.txt
            build-sha256.txt
          retention-days: 30

      - name: Scan and collect patch rejects
        if: ${{ always() }}
        run: |
          set -e
          CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"
          # Find all .rej files under the configuration directory
          mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files under $CONFIG_DIR"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              # Relative path from $CONFIG
              REL="${REJ#"$CONFIG_DIR"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"
              # Copy the associated original file alongside the .rej
              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
                mkdir -p "$(dirname "$ORIG_DEST")"
                cp "$ORIG" "$ORIG_DEST"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: Upload Rejects
        if: ${{ always() && env.REJ_COUNT > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9